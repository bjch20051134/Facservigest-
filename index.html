<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facservigest</title>
    <style>
        :root {
            --primary-color: #0077b6;
            --secondary-color: #00b4d8;
            --accent-color: #90e0ef;
            --text-color: #333;
            --bg-color: #caf0f8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 3em;
        }
        section {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #f1f8f9;
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        li:hover {
            transform: translateX(10px);
            background-color: var(--accent-color);
        }
        .contact-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed var(--accent-color);
            text-align: center;
        }
        .contact-info a {
            display: inline-block;
            margin: 10px 15px;
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .contact-info a:hover {
            opacity: 0.9;
        }
        .btn-wa { background-color: #25d366; }
        .btn-ig { background-color: #c13584; }
        .btn-mail { background-color: #d9534f; }
    </style>
</head>
<body>
    <header>
        <h1>Facservigest</h1>
    </header>
    <section>
        <h2>Nuestros Servicios</h2>
        <ul>
            <li>Gestión</li>
            <li>Logística</li>
            <li>Mecánica Menor</li>
            <li>Calidad</li>
            <li>Compra</li>
            <li>Venta</li>
            <li>Servicio</li>
            <li>Diagnóstico</li>
        </ul>
        <div class="contact-info">
            <p><strong>¿Necesitas una orden de trabajo? Contáctanos:</strong></p>
            <p>Teléfono: 9 5731 6137</p>
            <a href="https://wa.me/56993224516" class="btn-wa">WhatsApp</a>
            <a href="https://instagram.com/fredyalexyscuevasmoreira1" class="btn-ig">Instagram</a>
            <a href="mailto:fac_moreira@hotmail.com" class="btn-mail">Correo</a>
        </div>
    </section>
</body>
</html>
